name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job here needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

      - name: Self-test
        run: python -m app.selftest

      - name: Frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node test
        run: node --test --test-timeout=30000 tests/frontend.test.mjs

  build:
    name: Build Windows EXE
    # Only tags produce a release; everything else just proves the exe builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm LocalAvatarFavourites.spec

      # The spec excludes a long list of modules, so a bundle can build
      # successfully and still be broken. This proved it: excluding 'bottle'
      # produced an exe that died on startup at webview.http.
      - name: Smoke-test the frozen bundle
        run: |
          .\dist\LocalAvatarFavourites.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "frozen bundle self-test failed" }

      - name: Report size
        run: |
          $mb = [math]::Round((Get-Item dist\LocalAvatarFavourites.exe).Length / 1MB, 1)
          "LocalAvatarFavourites.exe: $mb MB" | Tee-Object -FilePath dist/SIZE.txt

      - name: Checksum
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('dist/LocalAvatarFavourites.exe');print(hashlib.sha256(p.read_bytes()).hexdigest(),p.name)" > dist/SHA256SUMS.txt
          type dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalAvatarFavourites
          path: |
            dist/LocalAvatarFavourites.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LocalAvatarFavourites.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true