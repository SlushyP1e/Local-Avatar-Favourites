name: CI

on:
  push:
    branches: [main]
    # Tag pushes must be listed explicitly. With only `branches` here, GitHub
    # ignores tag pushes entirely, so the release job never runs and tagging
    # silently produces nothing.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege: no job here needs to write to the repository.
permissions:
  contents: read

env:
  # The self-test prints real VRChat data, and VRChat names are full of
  # characters the Windows console codepage cannot encode. Without this the
  # reporter can die mid-run on a name like ［Protogen］Kuro and the whole suite
  # reports as failed. The suite also reconfigures its own streams, but pinning
  # the mode here keeps the runner's output readable too.
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff mypy

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

      - name: Self-test
        run: python -m app.selftest

      - name: Frontend tests
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Node test
        run: node --test --test-timeout=30000 tests/frontend.test.mjs

  build:
    name: Build Windows EXE
    # Runs everywhere, including pull requests. This used to be gated on tags,
    # which meant a change to the packaging or to upload-artifact could never be
    # validated until a release -- so dependabot PRs touching this job showed a
    # green tick that proved nothing. Building the exe is also the only check
    # that catches a bundle which compiles but cannot start.
    needs: check
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      # --clean matches build.bat. PyInstaller reuses build\, and a stale bundle
      # is indistinguishable from a broken feature: the UI silently loses
      # behaviour with nothing reporting an error. A fresh checkout makes this
      # unlikely here, but the two build paths should not differ.
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean LocalAvatarFavourites.spec

      # The spec excludes a long list of modules, so a bundle can build
      # successfully and still be broken. This proved it: excluding 'bottle'
      # produced an exe that died on startup at webview.http.
      #
      # The exe is built with console=False, so it is a GUI-subsystem binary and
      # PowerShell does not wait for it: reading $LASTEXITCODE straight after the
      # call inspects whatever ran before, not this process. Start-Process -Wait
      # -PassThru is what actually observes the exit code, and stdout has to be
      # redirected or it goes nowhere.
      - name: Smoke-test the frozen bundle
        run: |
          $log = Join-Path $env:RUNNER_TEMP "selftest.log"
          $p = Start-Process -FilePath .\dist\LocalAvatarFavourites.exe `
            -ArgumentList "--selftest" -Wait -PassThru `
            -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Get-Content $log
          if (Test-Path "$log.err") { Get-Content "$log.err" }
          if ($p.ExitCode -ne 0) {
            throw "frozen bundle self-test failed with exit code $($p.ExitCode)"
          }
          "frozen bundle self-test passed"

      - name: Report size
        run: |
          $mb = [math]::Round((Get-Item dist\LocalAvatarFavourites.exe).Length / 1MB, 1)
          "LocalAvatarFavourites.exe: $mb MB" | Tee-Object -FilePath dist/SIZE.txt

      - name: Checksum
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('dist/LocalAvatarFavourites.exe');print(hashlib.sha256(p.read_bytes()).hexdigest(),p.name)" > dist/SHA256SUMS.txt
          type dist/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LocalAvatarFavourites
          path: |
            dist/LocalAvatarFavourites.exe
            dist/SHA256SUMS.txt

  release:
    name: Publish release
    # Kept separate from build so the write token is only ever handed to the one
    # job that publishes, and never to a job that runs on pull requests.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # No checkout: this job only republishes the artifact the build job
      # already produced, so it needs no source. The download and checkout
      # versions must match the ones the build job used -- upload-artifact@v7
      # output is not readable by download-artifact@v4, which is what was
      # pinned here before.
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: LocalAvatarFavourites
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/LocalAvatarFavourites.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true